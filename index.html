<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DateAgora ❤️</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}body{margin:0;background:#050505;color:#f5f5f5}header{background:#000;color:white;padding:22px;text-align:center}main{max-width:650px;margin:auto;padding:18px}.card{background:#101010;border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 4px 18px #0008;border:1px solid #242424}input,textarea,button{width:100%;padding:14px;margin:7px 0;border-radius:10px;font-size:16px}input,textarea{border:1px solid #333;background:#080808;color:#fff}button{border:1px solid #333;background:#171717;color:white;font-weight:bold}.secondary{background:#0b0b0b;color:#fff}.heart{background:#e91e63}.green{background:#171717}.date{border:1px solid #2a2a2a;border-radius:15px;padding:16px;margin-top:12px}.small{font-size:14px;color:#aaa}.status{text-align:center;font-weight:bold;margin-top:10px}#app{display:none}.chat{max-height:280px;overflow:auto;border:1px solid #2a2a2a;border-radius:10px;padding:10px}.msg{padding:9px;margin:7px 0;background:#1a1a1a;border-radius:12px}.mine{background:#222}
</style></head><body>
<header><div style="font-size:44px">❤️</div><h1>DateAgora</h1><p>Encontros que acontecem hoje.</p></header><main>
<section id="login" class="card"><h2>Entrar no DateAgora</h2><input id="email" type="email" placeholder="Seu e-mail"><input id="senha" type="password" placeholder="Sua senha"><button onclick="entrar()">Entrar</button><button class="secondary" onclick="cadastrar()">Criar minha conta</button><button class="secondary" onclick="resetarSenha()">Esqueci minha senha</button><div id="status" class="status"></div></section>
<section id="reset" class="card" style="display:none"><h2>🔐 Criar nova senha</h2><p>Digite uma nova senha para sua conta.</p><input id="novaSenha" type="password" placeholder="Nova senha (mínimo 6 caracteres)"><input id="confirmaSenha" type="password" placeholder="Confirmar nova senha"><button onclick="salvarNovaSenha()">Salvar nova senha</button><div id="resetStatus" class="status"></div></section>
<section id="app">
<div class="card"><h2>🔥 Encontros de hoje</h2><p>Veja quem está procurando companhia hoje.</p><button onclick="carregarEncontros()">Atualizar encontros</button><div id="encontros"></div></div>
<div class="card"><h2>➕ Criar encontro hoje</h2><p class="small">Use locais públicos.</p><input id="dt" placeholder="Ex.: 🍹 Happy hour hoje"><input id="dh" type="datetime-local"><input id="dv" placeholder="Local público"><input id="dc" placeholder="Cidade"><textarea id="dd" placeholder="Conte como será o encontro"></textarea><input id="dm" type="number" min="2" max="50" value="10"><button onclick="criarEncontro()">🚀 Publicar encontro</button><div id="ds" class="status"></div></div>
<div class="card"><h2>📋 Meus encontros</h2><button onclick="meusEncontros()">Atualizar</button><div id="mineDates"></div></div>
<div class="card"><h2>💬 Minhas conversas</h2><button onclick="matches()">Atualizar conversas</button><div id="matchList"></div><div id="chat"></div></div>
<div class="card"><h2>👤 Meu perfil</h2><input id="nome" placeholder="Seu nome"><input id="idade" type="number" min="18" max="100" placeholder="Sua idade"><input id="cidade" placeholder="Sua cidade"><textarea id="bio" placeholder="Conte um pouco sobre você"></textarea><input id="musica" placeholder="🎵 Música do perfil (ex.: Spotify ou YouTube)" type="url"><input id="musicaNome" placeholder="Nome da música / artista"><div id="musicaPreview" class="small"></div><button onclick="salvarPerfil()">Salvar perfil</button><button class="secondary" onclick="sair()">Sair</button><div id="ps" class="status"></div></div>
</section></main>
<script>
const ehRecuperacao=()=>/type=recovery/i.test(location.href)||/[?&]reset=1/i.test(location.search);
const U="https://qehxxjuertsyadtecvfh.supabase.co",K="sb_publishable_AVeHuTYgCUnBxj9DZCxCgA_n1_Sm2Vc",S=supabase.createClient(U,K);
const $=id=>document.getElementById(id),esc=x=>{let d=document.createElement("div");d.textContent=x||"";return d.innerHTML};
async function cadastrar(){let e=$("email").value.trim(),p=$("senha").value;if(!e||p.length<6){$("status").innerText="Digite e-mail e senha com pelo menos 6 caracteres.";return} $("status").innerText="Criando sua conta...";let{error}=await S.auth.signUp({email:e,password:p});$("status").innerText=error?"Erro: "+error.message:"✅ Conta criada! Verifique seu e-mail."}
async function entrar(){let e=$("email").value.trim(),p=$("senha").value;if(!e||!p){$("status").innerText="Digite e-mail e senha.";return} $("status").innerText="Entrando...";let{error}=await S.auth.signInWithPassword({email:e,password:p});if(error){$("status").innerText="Erro: "+error.message;return}abrir()}
async function resetarSenha(){let e=$("email").value.trim();if(!e){$("status").innerText="Digite seu e-mail.";return}let{error}=await S.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname+"?reset=1"});$("status").innerText=error?"Erro: "+error.message:"📧 Link de recuperação enviado."}
async function salvarNovaSenha(){
 let p=$("novaSenha").value,c=$("confirmaSenha").value;
 if(p.length<6){$("resetStatus").innerText="A senha precisa ter pelo menos 6 caracteres.";return}
 if(p!==c){$("resetStatus").innerText="As senhas não conferem.";return}
 $("resetStatus").innerText="Validando sessão...";
 let {data:{session}}=await S.auth.getSession();
 if(!session){
   const hash=new URLSearchParams(location.hash.replace(/^#/,'')).toString();
   const access_token=new URLSearchParams(hash).get("access_token");
   const refresh_token=new URLSearchParams(hash).get("refresh_token");
   if(access_token&&refresh_token){
     const r=await S.auth.setSession({access_token,refresh_token});
     session=r.data?.session||null;
   }
 }
 if(!session){$("resetStatus").innerText="O link de recuperação expirou ou não está mais ativo. Solicite um novo link e abra-o imediatamente.";return}
 $("resetStatus").innerText="Salvando...";
 let{error}=await S.auth.updateUser({password:p});
 if(error){$("resetStatus").innerText="Erro: "+error.message;return}
 $("resetStatus").innerText="✅ Senha alterada com sucesso!";
 history.replaceState({},document.title,location.pathname);
 setTimeout(()=>abrir(),700)
}
async function abrir(){$("login").style.display="none";$("reset").style.display="none";$("app").style.display="block";await perfil();await carregarEncontros();await meusEncontros();await matches()}
async function perfil(){let{data:{user}}=await S.auth.getUser();if(!user)return;let{data}=await S.from("profiles").select("*").eq("id",user.id).maybeSingle();if(data){nome.value=data.name||"";idade.value=data.age||"";cidade.value=data.city||"";bio.value=data.bio||"";musica.value=data.music_url||"";musicaNome.value=data.music_name||"";musicaPreview.innerHTML=data.music_url?`🎵 <a href="${esc(data.music_url)}" target="_blank" rel="noopener" style="color:#fff">${esc(data.music_name||"Ouvir música")}</a>`:""}}
async function salvarPerfil(){let{data:{user}}=await S.auth.getUser(),n=nome.value.trim(),a=Number(idade.value),c=cidade.value.trim(),b=bio.value.trim(),mu=musica.value.trim(),mn=musicaNome.value.trim();if(!n||a<18||a>100||!c){$("ps").innerText="Preencha nome, idade válida e cidade.";return}let{error}=await S.from("profiles").upsert({id:user.id,name:n,age:a,city:c,bio:b,music_url:mu||null,music_name:mn||null});$("ps").innerText=error?"Erro: "+error.message:"✅ Perfil salvo com sucesso!";if(!error)musicaPreview.innerHTML=mu?`🎵 <a href="${esc(mu)}" target="_blank" rel="noopener" style="color:#fff">${esc(mn||"Ouvir música")}</a>`:""}
function hoje(){let d=new Date;d.setHours(0,0,0,0);return d}function fim(){let d=new Date;d.setHours(23,59,59,999);return d}
async function carregarEncontros(){let a=$("encontros");a.innerHTML="Carregando...";let{data,error}=await S.from("dates").select("*").gte("date_time",hoje().toISOString()).lte("date_time",fim().toISOString()).eq("status","active").order("date_time");if(error){a.innerText="Erro ao carregar encontros.";return}if(!data?.length){a.innerHTML="<p>Nenhum encontro publicado para hoje.</p>";return}a.innerHTML="";data.forEach(e=>{let d=document.createElement("div");d.className="date";d.innerHTML=`<h3>${esc(e.title)}</h3><p>🕐 ${new Date(e.date_time).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}</p><p>📍 ${esc(e.venue_name)} — ${esc(e.city)}</p><p>${esc(e.description)}</p>`;let b=document.createElement("button");b.className="heart";b.innerText="❤️ Tenho interesse";b.onclick=()=>interesse(e.id);d.appendChild(b);a.appendChild(d)})}
async function criarEncontro(){let{data:{user}}=await S.auth.getUser(),t=$("dt").value.trim(),w=new Date($("dh").value),v=$("dv").value.trim(),c=$("dc").value.trim(),d=$("dd").value.trim(),m=Math.max(2,Math.min(50,Number($("dm").value)||10));if(!t||!v||!c||isNaN(w)||w<new Date()){ $("ds").innerText="Preencha os campos e escolha um horário futuro.";return}if(w.toDateString()!=new Date().toDateString()){$("ds").innerText="O encontro deve acontecer hoje.";return}let{error}=await S.from("dates").insert({creator_id:user.id,title:t,date_time:w.toISOString(),venue_name:v,city:c,description:d,max_people:m,status:"active"});$("ds").innerText=error?"Erro: "+error.message:"✅ Encontro publicado!";if(!error){$("dt").value=$("dh").value=$("dv").value=$("dd").value="";await carregarEncontros();await meusEncontros()}}
async function interesse(id){let{data:{user}}=await S.auth.getUser(),{data:x}=await S.from("dates").select("creator_id").eq("id",id).maybeSingle();if(x?.creator_id===user.id){alert("Você não pode demonstrar interesse no próprio encontro.");return}let{error}=await S.from("date_interests").insert({date_id:id,user_id:user.id});alert(error?(error.code==="23505"?"Você já demonstrou interesse.":"Erro: "+error.message):"❤️ Interesse enviado!")}
async function meusEncontros(){let a=$("mineDates"),{data:{user}}=await S.auth.getUser();a.innerHTML="";let{data,error}=await S.from("dates").select("*").eq("creator_id",user.id).order("date_time",{ascending:false});if(error){a.innerText="Erro ao carregar.";return}if(!data?.length){a.innerHTML="<p>Você ainda não publicou nenhum encontro.</p>";return}for(let e of data){let d=document.createElement("div");d.className="date";d.innerHTML=`<h3>${esc(e.title)}</h3><p>📍 ${esc(e.venue_name)} — ${esc(e.city)}</p><div id="i${e.id}">Carregando interessados...</div>`;a.appendChild(d);interessados(e.id)}}
async function interessados(id){let a=$("i"+id),{data,error}=await S.from("date_interests").select("id,user_id,status").eq("date_id",id);if(error){a.innerText="Erro.";return}if(!data?.length){a.innerText="❤️ Nenhum interessado ainda.";return}let ids=data.map(x=>x.user_id),{data:p}=await S.from("profiles").select("id,name,age,city").in("id",ids),map=Object.fromEntries((p||[]).map(x=>[x.id,x]));a.innerHTML="<b>❤️ Interessados</b>";data.forEach(i=>{let x=map[i.user_id]||{},d=document.createElement("div");d.className="date";d.innerHTML=`<b>${esc(x.name||"Usuário")}</b> ${x.age||""} ${esc(x.city||"")}<br><span>${i.status==="accepted"?"✅ Aceito":"⏳ Pendente"}</span>`;if(i.status==="pending"){let b=document.createElement("button");b.className="green";b.innerText="❤️ Aceitar e abrir conversa";b.onclick=()=>aceitar(i.id,id,i.user_id);d.appendChild(b)}a.appendChild(d)})}
async function aceitar(i,d,u){let{data:{user}}=await S.auth.getUser();let{error}=await S.from("date_interests").update({status:"accepted"}).eq("id",i);if(error){alert(error.message);return}let r=await S.from("matches").insert({date_id:d,user_one_id:user.id,user_two_id:u});if(r.error&&r.error.code!=="23505")alert("Aceito, mas não abriu conversa: "+r.error.message);else alert("❤️ Match criado!");interessados(d);matches()}
async function matches(){let a=$("matchList"),{data:{user}}=await S.auth.getUser(),{data,error}=await S.from("matches").select("*").or("user_one_id.eq."+user.id+",user_two_id.eq."+user.id).order("created_at",{ascending:false});if(error){a.innerText="Erro: "+error.message;return}if(!data?.length){a.innerHTML="<p>Nenhuma conversa ainda.</p>";return}let ids=data.map(m=>m.user_one_id===user.id?m.user_two_id:m.user_one_id),{data:p}=await S.from("profiles").select("id,name").in("id",ids),map=Object.fromEntries((p||[]).map(x=>[x.id,x]));a.innerHTML="";data.forEach(m=>{let id=m.user_one_id===user.id?m.user_two_id:m.user_one_id,b=document.createElement("button");b.className="secondary";b.innerText="💬 "+(map[id]?.name||"Usuário");b.onclick=()=>chat(m.id,map[id]?.name||"Usuário");a.appendChild(b)})}
async function chat(id,n){$("chat").innerHTML=`<div class="date"><h3>💬 ${esc(n)}</h3><div id="msgs" class="chat">Carregando...</div><input id="mi" placeholder="Digite uma mensagem"><button onclick="enviar('${id}')">Enviar</button></div>`;carregarMensagens(id)}
async function carregarMensagens(id){let a=$("msgs"),{data,error}=await S.from("messages").select("*").eq("match_id",id).order("created_at");if(error){a.innerText="Erro ao carregar mensagens.";return}let{data:{user}}=await S.auth.getUser();a.innerHTML="";(data||[]).forEach(m=>{let d=document.createElement("div");d.className="msg"+(m.sender_id===user.id?" mine":"");d.innerHTML=`<b>${m.sender_id===user.id?"Você":"Outra pessoa"}:</b> ${esc(m.message)}`;a.appendChild(d)})}
async function enviar(id){let m=$("mi").value.trim();if(!m)return;let{data:{user}}=await S.auth.getUser(),{error}=await S.from("messages").insert({match_id:id,sender_id:user.id,message:m});if(error){alert(error.message);return}$("mi").value="";carregarMensagens(id)}
async function sair(){await S.auth.signOut();$("app").style.display="none";$("login").style.display="block";$("status").innerText="Você saiu da sua conta."}
function mostrarRecuperacao(){
  $("login").style.display="none";
  $("app").style.display="none";
  $("reset").style.display="block";
}
if(ehRecuperacao()) mostrarRecuperacao();
S.auth.onAuthStateChange((event,s)=>{
  if(event==="PASSWORD_RECOVERY"||ehRecuperacao()){
    mostrarRecuperacao();
    return;
  }
  if(s) setTimeout(abrir,0);
});
S.auth.getSession().then(({data})=>{
  if(ehRecuperacao()) mostrarRecuperacao();
  else if(data.session) abrir();
});
</script></body></html>
