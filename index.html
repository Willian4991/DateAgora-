<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DateAgora ❤️</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6fb;
      color: #172033;
    }

    header {
      background: #071a3d;
      color: white;
      padding: 22px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 7px 0 0;
      opacity: .85;
    }

    main {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    h2 {
      margin-top: 0;
    }

    input, textarea {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border: 1px solid #d8dce5;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      border: 0;
      padding: 14px;
      border-radius: 12px;
      background: #0b3b8f;
      color: white;
      font-size: 16px;
      font-weight: bold;
      margin-top: 8px;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    .secondary {
      background: #e9edf5;
      color: #172033;
    }

    .date {
      border: 1px solid #e1e5ed;
      border-radius: 15px;
      padding: 16px;
      margin-top: 12px;
    }

    .heart {
      background: #e91e63;
    }

    #app {
      display: none;
    }

    #status {
      margin-top: 12px;
      text-align: center;
      font-weight: bold;
    }

    .logo {
      font-size: 45px;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">❤️</div>
  <h1>DateAgora</h1>
  <p>Encontros que acontecem hoje.</p>
</header>

<main>

  <!-- LOGIN / CADASTRO -->
  <section id="login" class="card">
    <h2>Entrar no DateAgora</h2>

    <input id="email" type="email" placeholder="Seu e-mail">

    <input id="senha" type="password" placeholder="Sua senha">

    <button onclick="entrar()">Entrar</button>

    <button class="secondary" onclick="cadastrar()">
      Criar minha conta
    </button>

    <div id="status"></div>
  </section>

  <!-- APLICATIVO -->
  <section id="app">

    <div class="card">
      <h2>🔥 Encontros de hoje</h2>
      <p>Veja quem está procurando companhia hoje.</p>

      <button onclick="carregarEncontros()">
        Atualizar encontros
      </button>

      <div id="encontros"></div>
    </div>

    <div class="card">
      <h2>👤 Meu perfil</h2>

      <input id="nome" placeholder="Seu nome">

      <input id="idade" type="number" placeholder="Sua idade">

      <input id="cidade" placeholder="Sua cidade">

      <textarea id="bio" placeholder="Conte um pouco sobre você"></textarea>

      <button onclick="salvarPerfil()">
        Salvar perfil
      </button>

      <button class="secondary" onclick="sair()">
        Sair
      </button>

      <div id="perfilStatus"></div>
    </div>

  </section>

</main>

<script>

  /*
    DATEAGORA
    Conexão com o Supabase
  */

  const SUPABASE_URL =
    "https://qehxxjuertsyadtecvfh.supabase.co";

  /*
    IMPORTANTE:
    coloque aqui a sua chave PUBLICÁVEL do Supabase.
    Use a chave "Publishable", nunca a service_role.
  */

  const SUPABASE_KEY =
  "sb_publishable_AVeHuTYgCUnBxj9DZCxCgA_n1_Sm2Vc"

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  async function cadastrar() {

    const email =
      document.getElementById("email").value.trim();

    const senha =
      document.getElementById("senha").value;

    const status =
      document.getElementById("status");

    if (!email || !senha) {
      status.innerText =
        "Digite seu e-mail e uma senha.";
      return;
    }

    status.innerText = "Criando sua conta...";

    const { data, error } =
      await supabaseClient.auth.signUp({
        email: email,
        password: senha
      });

    if (error) {
      status.innerText =
        "Erro: " + error.message;
      return;
    }

    status.innerText =
      "Conta criada! Verifique seu e-mail se for solicitado.";
  }


  async function entrar() {

    const email =
      document.getElementById("email").value.trim();

    const senha =
      document.getElementById("senha").value;

    const status =
      document.getElementById("status");

    if (!email || !senha) {
      status.innerText =
        "Digite seu e-mail e sua senha.";
      return;
    }

    status.innerText = "Entrando...";

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: senha
      });

    if (error) {
      status.innerText =
        "Erro: " + error.message;
      return;
    }

    abrirAplicativo();
  }


  async function abrirAplicativo() {

    document.getElementById("login").style.display =
      "none";

    document.getElementById("app").style.display =
      "block";

    await carregarPerfil();
    await carregarEncontros();
  }


  async function carregarPerfil() {

    const {
      data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) return;

    const { data, error } =
      await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", user.id)
        .maybeSingle();

    if (error || !data) return;

    document.getElementById("nome").value =
      data.name || "";

    document.getElementById("idade").value =
      data.age || "";

    document.getElementById("cidade").value =
      data.city || "";

    document.getElementById("bio").value =
      data.bio || "";
  }


  async function salvarPerfil() {

    const {
      data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) return;

    const nome =
      document.getElementById("nome").value.trim();

    const idade =
      Number(document.getElementById("idade").value);

    const cidade =
      document.getElementById("cidade").value.trim();

    const bio =
      document.getElementById("bio").value.trim();

    const { error } =
      await supabaseClient
        .from("profiles")
        .upsert({
          id: user.id,
          name: nome,
          age: idade,
          city: cidade,
          bio: bio
        });

    const status =
      document.getElementById("perfilStatus");

    if (error) {
      status.innerText =
        "Erro ao salvar: " + error.message;
      return;
    }

    status.innerText =
      "✅ Perfil salvo com sucesso!";
  }


  async function carregarEncontros() {

    const area =
      document.getElementById("encontros");

    area.innerHTML =
      "Carregando encontros...";

    const agora =
      new Date();

    const inicio =
      new Date();

    inicio.setHours(0,0,0,0);

    const fim =
      new Date();

    fim.setHours(23,59,59,999);

    const { data, error } =
      await supabaseClient
        .from("dates")
        .select("*")
        .gte("date_time", inicio.toISOString())
        .lte("date_time", fim.toISOString())
        .eq("status", "active")
        .order("date_time", { ascending: true });

    if (error) {
      area.innerHTML =
        "Erro ao carregar encontros.";
      return;
    }

    if (!data || data.length === 0) {
      area.innerHTML =
        "<p>Nenhum encontro publicado para hoje.</p>";
      return;
    }

    area.innerHTML = "";

    data.forEach(encontro => {

      const horario =
        new Date(encontro.date_time)
          .toLocaleTimeString(
            "pt-BR",
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          );

      const div =
        document.createElement("div");

      div.className = "date";

      div.innerHTML = `
        <h3>${escapeHtml(encontro.title)}</h3>

        <p>
          🕐 Hoje às ${horario}
        </p>

        <p>
          📍 ${escapeHtml(encontro.venue_name)}
          — ${escapeHtml(encontro.city)}
        </p>

        <p>
          ${escapeHtml(encontro.description || "")}
        </p>

        <button class="heart"
          onclick="tenhoInteresse('${encontro.id}')">
          ❤️ Tenho interesse
        </button>
      `;

      area.appendChild(div);
    });
  }


  async function tenhoInteresse(dateId) {

    const {
      data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) {
      alert("Entre na sua conta primeiro.");
      return;
    }

    const { error } =
      await supabaseClient
        .from("date_interests")
        .insert({
          date_id: dateId,
          user_id: user.id
        });

    if (error) {

      if (error.code === "23505") {
        alert("Você já demonstrou interesse neste encontro.");
      } else {
        alert("Não foi possível enviar o interesse.");
      }

      return;
    }

    alert("❤️ Interesse enviado!");
  }


  async function sair() {

    await supabaseClient.auth.signOut();

    document.getElementById("app").style.display =
      "none";

    document.getElementById("login").style.display =
      "block";

    document.getElementById("status").innerText =
      "Você saiu da sua conta.";
  }


  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent =
      text || "";

    return div.innerHTML;
  }


  /*
    Verifica se já existe uma sessão
  */

  supabaseClient.auth.getSession()
    .then(({ data }) => {

      if (data.session) {
        abrirAplicativo();
      }

    });

</script>

</body>
</html>
